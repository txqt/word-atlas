<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0D1120" />
    <meta name="twitter:title" content="Word Atlas · One word, one picture" />
    <meta name="twitter:image" content="https://0xlei.tech/words/brand/og-card.jpg" />
    <title>Word Atlas · One word, one picture — light up your IELTS</title>
    <meta name="description" content="7,298 core IELTS words, each with an original illustration, two original example sentences and UK/US audio. Learn one, light one star. Free, open source, no sign-up." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Word Atlas · One word, one picture" />
    <meta property="og:description" content="7,298 IELTS words, each with its own picture. Learn one, light one star. Free, open source, no sign-up." />
    <meta property="og:image" content="https://0xlei.tech/words/brand/og-card.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-512.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="preload" href="%BASE_URL%atlas/index.json" as="fetch" crossorigin="anonymous" />
    <script>
      // Apply the saved theme (dark by default) before first paint.
      (function () {
        var t = "dark";
        try {
          var s = JSON.parse(localStorage.getItem("word-atlas:settings") || "{}");
          if (s.theme) t = s.theme;
        } catch (e) {}
        if (t !== "system") document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
